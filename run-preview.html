<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run animation preview</title><style>body{margin:0;background:#d4e7cf;color:#294b40;font:16px system-ui;text-align:center;padding:20px}canvas{display:block;margin:12px auto;background:#b4d1a4;border-radius:20px;width:min(100%,800px);height:auto}button,input{margin:12px}a{color:inherit}</style><h1>Run animation · v0.4.0</h1><p>Continuous joints · fixed limb lengths · planted feet</p><canvas width="1000" height="460"></canvas><button id="pause">Pause</button><label>Speed <input id="speed" type="range" min="0.2" max="1.5" value="1" step="0.1"></label><label><input type="checkbox" id="mirror">Face left</label><p><a href="./?v=0.4.0">Back to the game</a></p><script type="module">import{drawRun}from'./run-rig.js?v=0.4.0';const im=new Image();im.src='assets/run-rig.png?v=0.4.0';await im.decode();const ctx=document.querySelector('canvas').getContext('2d');let phase=0,last=0,paused=false;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};function loop(t){if(last&&!paused)phase=(phase+Math.min((t-last)/1000,.05)*280/160*+document.querySelector('#speed').value)%1;last=t;ctx.clearRect(0,0,1000,460);ctx.fillStyle='#6d994f';ctx.fillRect(0,400,1000,60);ctx.save();ctx.translate(500,400);ctx.scale(1.8,1.8);drawRun(ctx,im,0,0,document.querySelector('#mirror').checked?-1:1,phase);ctx.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></html>
